services:
  llm-gateway:
    # 自建/第三方 OpenAI 兼容网关（占位示例，请替换为你实际的服务）
    image: your-llm-gateway:latest
    ports:
      - "18000:8000"

  agent-gateway:
    build:
      # context 相对 compose 文件目录(docker/)，Dockerfile 内 COPY gateway/... 以此为根
      context: .
      dockerfile: Dockerfile
      args:
        # 国内构建可传 APT_MIRROR=mirrors.ustc.edu.cn / mirrors.aliyun.com；海外用默认官方源。
        APT_MIRROR: ${APT_MIRROR:-}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 模型网关连接（改 base_url 场景）
      LLM_BASE_URL: http://llm-gateway:8000/v1
      LLM_API_KEY: ${LLM_API_KEY:-unknown}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API: chat
      # 业务系统日志接收端点（业务侧自己对接；不配置则丢弃日志）
      LOG_SINK_URL: ${LOG_SINK_URL:-}
      # 存储
      DB_URL: sqlite:///./gateway.db
      # Skill：volume 挂载宿主机 hermes skills 目录，改动热生效无需重建镜像
      SKILLS_DIR: /srv/gateway/skills
      # 启用的 skill 白名单（逗号分隔；空=全部）。如: SKILLS_ENABLED: lp-deploy-ops,lp-project-ops
      SKILLS_ENABLED: ${SKILLS_ENABLED:-}
      # MCP 工具配置（skill 配套的标准 MCP 服务器）
      MCP_CONFIG_PATH: /srv/gateway/mcp_servers.json
    volumes:
      - ./data:/srv/gateway
      # skill 目录：宿主机 hermes 的 skills 目录（按需改路径）
      - ${HERMES_SKILLS_DIR:-/home/ctyun/.hermes/skills}:/srv/gateway/skills:ro
      # MCP 服务器配置（见 ./mcp_servers.example.json）
      - ./mcp_servers.json:/srv/gateway/mcp_servers.json:ro