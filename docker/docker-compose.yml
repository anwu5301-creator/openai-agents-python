services:
  llm-gateway:
    # 自建/第三方 OpenAI 兼容网关（占位示例，请替换为你实际的服务）
    image: your-llm-gateway:latest
    ports:
      - "18000:8000"

  agent-gateway:
    build:
      # context 相对 compose 文件目录(docker/)，Dockerfile 内 COPY gateway/... 以此为根
      context: .
      dockerfile: Dockerfile
      args:
        # 国内构建可传 APT_MIRROR=mirrors.ustc.edu.cn / mirrors.aliyun.com；海外用默认官方源。
        APT_MIRROR: ${APT_MIRROR:-}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 模型网关连接（改 base_url 场景）
      LLM_BASE_URL: http://llm-gateway:8000/v1
      LLM_API_KEY: ${LLM_API_KEY:-unknown}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API: chat
      # 业务系统日志接收端点（业务侧自己对接；不配置则丢弃日志）
      LOG_SINK_URL: ${LOG_SINK_URL:-}
      # 存储（DB 文件挂载到 data 子目录，避免整目录覆盖容器内 gateway 代码）
      GATEWAY_DB_URL: sqlite:////srv/gateway/data/gateway.db
      # 数据/工作目录：trace JSONL、sqlite 等（默认 /srv/gateway/data，与下方 volume 对应）
      GATEWAY_DATA_DIR: /srv/gateway/data
      # Skill：只读预装技能目录（相对本 compose 文件；技能包放 ./skills 下，改动热生效无需重建镜像）
      SKILLS_DIR: /srv/gateway/skills
      # 启用的 skill 白名单（逗号分隔；空=全部）。如: SKILLS_ENABLED: lp-deploy-ops,lp-project-ops
      SKILLS_ENABLED: ${SKILLS_ENABLED:-}
      # MCP 工具配置：种子文件（只读挂载，宿主机手工维护；首次写入托管文件时继承其内容）
      MCP_CONFIG_PATH: /srv/gateway/mcp_servers.json
      # 托管配置（可写）：由 /mcp/* 接口维护（WeKnora「MCP 管理」页下发），存在时优先于种子文件
      MCP_MANAGED_PATH: /srv/gateway/data/mcp_servers.json
      # /mcp/* 写接口鉴权令牌（请求头 X-Internal-Token）；留空则不校验（仅内网时可用）
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN:-}
      # MCP 连通性测试超时（秒）
      MCP_TEST_TIMEOUT_S: ${MCP_TEST_TIMEOUT_S:-20}
    volumes:
      # 只挂载 data 子目录（DB 文件持久化）；挂 /srv/gateway 整目录会覆盖镜像内 gateway/ 代码
      - ./data:/srv/gateway/data
      # skill 目录：随部署目录自带的 ./skills（勿指向宿主机 ~/.hermes/skills，
      # 那会把无关的助手技能暴露成业务技能，且换机部署时技能全部丢失）
      - ./skills:/srv/gateway/skills:ro
      # MCP 服务器配置（见 ./mcp_servers.example.json）
      - ./mcp_servers.json:/srv/gateway/mcp_servers.json:ro